name: Release

on:
  push:
    branches: [main]

jobs:
  # Opens/updates the release PR from conventional commits (fix: / feat: / feat!:).
  # Its single commit bumps package.json, CHANGELOG.md and ext.json's version (extra-files in
  # release-please-config.json). When the PR is merged, creates the tag (plain "1.2.3") and the release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  # After the PR is merged: build the theme, attach the plugin zip to the GitHub release
  # (download_url), then publish ext.json and theme.css to the Cloudflare Worker (url, latest_url).
  # Order matters: the zip must exist before the Worker advertises the new version.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build
        run: ./build.sh

      - name: Attach theme.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -q theme.zip package.json dist/theme.css
          gh release upload "${{ needs.release-please.outputs.tag_name }}" theme.zip --clobber

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p public
          cp ext.json dist/theme.css public/
          npx --yes wrangler@4 deploy
